<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ECE Intermediate & Tricky Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;min-height:100vh;background:linear-gradient(135deg,#111827,#312e81);display:flex;justify-content:center;align-items:center;padding:15px;color:#111827}
.card{width:100%;max-width:680px;background:white;border-radius:22px;padding:25px;box-shadow:0 20px 50px #0005}
h1{text-align:center;font-size:24px;margin:0 0 20px}
input{width:100%;padding:14px;margin:7px 0 12px;border:2px solid #e5e7eb;border-radius:12px;font-size:16px}
.start,.next,.restart{width:100%;border:0;border-radius:14px;padding:14px;background:#4f46e5;color:white;font-size:16px;font-weight:bold}
.top{display:flex;justify-content:space-between;margin-bottom:14px;font-weight:bold;color:#4b5563}
.timer{background:#eef2ff;color:#4338ca;padding:9px 14px;border-radius:99px}
.danger{background:#fee2e2;color:#dc2626}
.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:22px}
.fill{height:100%;background:#4f46e5;width:0}
.question{font-size:20px;font-weight:bold;line-height:1.45;margin-bottom:18px}
.options{display:grid;gap:12px}
.option{border:2px solid #e5e7eb;background:white;border-radius:14px;padding:15px;text-align:left;font-size:16px}
.option.selected{border-color:#4f46e5;background:#e0e7ff}
.option:disabled{cursor:not-allowed}
.next{margin-top:18px}
.next:disabled{opacity:.45}
.result{display:none;text-align:center}
.score{font-size:50px;font-weight:800;color:#4f46e5;margin:18px}
.small{text-align:center;color:#6b7280;font-size:13px;margin-top:10px}
@media(max-width:500px){.card{padding:20px}.question{font-size:18px}}
</style>
</head>

<body>
<div class="card">

<section id="start">
<h1>ECE Intermediate & Tricky Quiz</h1>
<p>Enter your details to start</p>
<input id="name" placeholder="Enter your Name">
<input id="email" placeholder="Enter Email / ID">
<button class="start" onclick="startQuiz()">Start Quiz →</button>
</section>

<section id="quiz" style="display:none">
<h1>ECE Intermediate & Tricky Quiz</h1>

<div class="top">
<span id="counter">Question 1 / 30</span>
<span class="timer" id="timer">15s</span>
</div>

<div class="bar"><div class="fill" id="fill"></div></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>

<button class="next" id="next" disabled>Next Question →</button>
<p class="small">Choose one answer. Correct answers are not shown during the quiz.</p>
</section>

<section class="result" id="result">
<h2>Quiz Completed!</h2>
<p>Your Final Score</p>
<div class="score" id="score">0 / 30</div>
<p id="message"></p>
<p id="saveStatus"></p>
<br>
<button class="restart" onclick="restartQuiz()">↻ Restart Quiz</button>
</section>

</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwOAFd15wxPfG4VlJY8ZbeYq4_veZHYB8ttaOFQT35Jb12BjljyuT0PQDomgJMbqqjeIA/exec";

const questions=[
["A silicon diode is forward biased beyond its knee voltage. What happens to forward current?",["It increases rapidly","It becomes zero","It remains perfectly constant","It reverses direction"],0],
["An ideal capacitor connected to a DC source reaches steady state. What is its current?",["Zero","Maximum","Equal to supply current","Infinite"],0],
["In a common-emitter amplifier, the output voltage is generally:",["180° out of phase","In phase","90° out of phase","360° out of phase"],0],
["Which gate gives HIGH output only when all inputs are LOW?",["NOR","NAND","XOR","AND"],0],
["An 8-bit ADC has a 0–5 V range. Approximately what is one LSB?",["19.53 mV","39.06 mV","9.77 mV","78.13 mV"],0],
["In conventional AM, which carrier parameter is varied?",["Amplitude","Frequency","Phase only","Propagation speed"],0],
["An unconnected digital input of a microcontroller may produce:",["A floating logic state","A permanent short circuit","Automatic analog conversion","A guaranteed LOW"],0],
["At series RLC resonance, which statement is correct?",["Inductive and capacitive reactances cancel","Resistance becomes zero","Current becomes zero","Both reactances become infinite"],0],
["A 4-bit binary counter starts at 0000. After 15 clock pulses, the state is:",["1111","0000","1110","10000"],0],
["Which sensor detects human motion by sensing changes in infrared radiation?",["PIR","LDR","Ultrasonic","Thermistor"],0],
["The main function of a Zener diode in a regulator circuit is to:",["Maintain nearly constant voltage","Amplify current","Convert AC to frequency","Store charge"],0],
["Which transistor terminal controls the current between collector and emitter in a BJT?",["Base","Collector","Emitter","Substrate"],0],
["If the frequency of an AC signal increases while inductance remains constant, inductive reactance:",["Increases","Decreases","Becomes zero","Remains unchanged"],0],
["A full-wave rectifier converts:",["AC to pulsating DC","DC to AC","DC to DC only","AC to AC only"],0],
["Which flip-flop is commonly used to divide frequency by 2 when configured to toggle?",["T flip-flop","SR flip-flop","D latch","Encoder"],0],
["In a digital system, a multiplexer is used to:",["Select one input from many","Store one bit permanently","Convert analog to digital","Increase supply voltage"],0],
["Which communication medium generally provides the highest immunity to electromagnetic interference?",["Optical fiber","Twisted pair","Coaxial cable","Parallel copper wire"],0],
["The bandwidth of an ideal AM signal with a maximum modulating frequency fm is:",["2fm","fm","3fm","fm/2"],0],
["What happens to the resonant frequency of an LC circuit if capacitance is increased while inductance remains constant?",["It decreases","It increases","It remains unchanged","It becomes infinite"],0],
["An op-amp has very high open-loop gain. In a negative-feedback amplifier, feedback mainly:",["Stabilizes and controls the gain","Makes the gain infinite","Removes the power supply","Stops all current"],0],
["Which device converts a physical quantity such as temperature into an electrical signal?",["Sensor","Oscillator","Rectifier","Transformer"],0],
["In an ideal transformer, if the secondary turns are greater than the primary turns, the secondary voltage is:",["Higher","Lower","Always zero","Equal regardless of turns"],0],
["Which number system is directly associated with four binary bits?",["Hexadecimal","Decimal","Octal","Roman"],0],
["A 3-to-8 decoder has how many output lines?",["8","3","6","24"],0],
["In UART communication, what is commonly used to indicate the beginning of a transmitted character?",["Start bit","Stop bit","Parity bit","Clock bit"],0],
["Which microcontroller peripheral is most directly used to generate a variable duty-cycle digital waveform?",["PWM module","ADC","UART receiver","EEPROM"],0],
["If a resistor of 10 Ω carries 2 A, its power dissipation is:",["40 W","20 W","5 W","0.2 W"],0],
["In a PN junction under reverse bias, the depletion region generally:",["Widens","Disappears","Becomes zero","Changes into a conductor"],0],
["Which filter ideally passes frequencies below its cutoff frequency and attenuates frequencies above it?",["Low-pass filter","High-pass filter","Band-pass filter","Band-stop filter"],0],
["A sampling frequency must be at least what relative to the highest frequency component for ideal Nyquist sampling?",["Twice the highest frequency","Equal to the highest frequency","Half the highest frequency","Four times the lowest frequency"],0]
];

let current=0,score=0,selected=null,time=15,interval=null,name="",email="";

const q=document.getElementById("question");
const options=document.getElementById("options");
const timer=document.getElementById("timer");
const next=document.getElementById("next");

function startQuiz(){
name=document.getElementById("name").value.trim();
email=document.getElementById("email").value.trim();

if(!name||!email){
alert("Please enter Name and Email / ID");
return;
}

document.getElementById("start").style.display="none";
document.getElementById("quiz").style.display="block";
loadQuestion();
}

function loadQuestion(){
clearInterval(interval);
time=15;
selected=null;
next.disabled=true;
timer.textContent="15s";
timer.classList.remove("danger");

let item=questions[current];
document.getElementById("counter").textContent=`Question ${current+1} / ${questions.length}`;
document.getElementById("fill").style.width=((current+1)/questions.length*100)+"%";
q.textContent=item[0];
options.innerHTML="";

item[1].forEach((text,i)=>{
let b=document.createElement("button");
b.className="option";
b.textContent=String.fromCharCode(65+i)+". "+text;
b.onclick=()=>choose(i,b);
options.appendChild(b);
});

next.textContent=current===questions.length-1?"Finish Quiz →":"Next Question →";

interval=setInterval(()=>{
time--;
timer.textContent=time+"s";
if(time<=5)timer.classList.add("danger");
if(time<=0){
clearInterval(interval);
nextQuestion();
}
},1000);
}

function choose(i,b){
if(selected!==null)return;
selected=i;
b.classList.add("selected");
next.disabled=false;
document.querySelectorAll(".option").forEach(x=>x.disabled=true);
}

function nextQuestion(){
clearInterval(interval);

if(selected!==null && selected===questions[current][2])score++;

if(current<questions.length-1){
current++;
loadQuestion();
}else{
showResult();
}
}

next.onclick=nextQuestion;

function showResult(){
let correct=score;
let wrong=questions.length-correct;

document.getElementById("quiz").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("score").textContent=score+" / "+questions.length;

let percent=score/questions.length*100;
document.getElementById("message").textContent=
percent>=80?"Excellent result!":
percent>=60?"Good result!":
percent>=40?"Keep practicing.":
"You need more practice.";

sendData(correct,wrong);
}

function sendData(correct,wrong){
let data=new URLSearchParams();
data.append("name",name);
data.append("email",email);
data.append("score",score);
data.append("correct",correct);
data.append("wrong",wrong);

fetch(SCRIPT_URL,{
method:"POST",
mode:"no-cors",
headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
body:data.toString()
})
.then(()=>{
document.getElementById("saveStatus").textContent="Response submitted successfully.";
})
.catch(()=>{
document.getElementById("saveStatus").textContent="Quiz completed.";
});
}

function restartQuiz(){
current=0;
score=0;
document.getElementById("result").style.display="none";
document.getElementById("start").style.display="block";
document.getElementById("name").value="";
document.getElementById("email").value="";
}

</script>
</body>
</html>
