<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Challenge</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 20px;
}

.quiz-container {
    width: 100%;
    max-width: 600px;
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

h1 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    color: #555;
    font-weight: bold;
}

.timer {
    background: #f1f3f5;
    padding: 8px 14px;
    border-radius: 20px;
}

.timer.warning {
    background: #ffdddd;
    color: #e63946;
}

.progress {
    height: 8px;
    background: #eee;
    border-radius: 10px;
    margin-bottom: 25px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #667eea;
    transition: width 0.3s;
}

.question {
    font-size: 22px;
    font-weight: bold;
    color: #222;
    margin-bottom: 20px;
    line-height: 1.4;
}

.options {
    display: grid;
    gap: 12px;
}

.option {
    width: 100%;
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: white;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    border-color: #667eea;
    background: #f5f6ff;
}

.option.correct {
    background: #d8f3dc;
    border-color: #2a9d8f;
    color: #1b6e64;
}

.option.wrong {
    background: #ffe0e0;
    border-color: #e63946;
    color: #b4232c;
}

.option:disabled {
    cursor: not-allowed;
}

.result {
    display: none;
    text-align: center;
}

.result h2 {
    font-size: 32px;
    margin-bottom: 15px;
    color: #333;
}

.score {
    font-size: 48px;
    font-weight: bold;
    color: #667eea;
    margin: 20px 0;
}

.restart {
    border: none;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    padding: 14px 30px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.restart:hover {
    opacity: 0.9;
}

@media (max-width: 500px) {
    .quiz-container {
        padding: 20px;
        border-radius: 16px;
    }

    h1 {
        font-size: 25px;
    }

    .question {
        font-size: 19px;
    }

    .option {
        font-size: 15px;
        padding: 13px;
    }
}
</style>
</head>

<body>

<div class="quiz-container">

    <div id="quiz">

        <h1>🧠 Quiz Challenge</h1>

        <div class="top-bar">
            <span id="questionNumber">Question 1 / 15</span>
            <span class="timer" id="timer">15s</span>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="question" id="question"></div>

        <div class="options" id="options"></div>

    </div>

    <div class="result" id="result">

        <h2>🎉 Quiz Completed!</h2>

        <p>Your Final Score</p>

        <div class="score" id="score">0 / 15</div>

        <p id="message"></p>

        <br>

        <button class="restart" onclick="restartQuiz()">
            🔄 Restart Quiz
        </button>

    </div>

</div>


<script>

const questions = [

{
    question: "What does HTML stand for?",
    options: [
        "Hyper Text Markup Language",
        "High Tech Modern Language",
        "Hyper Transfer Markup Language",
        "Home Tool Markup Language"
    ],
    answer: 0
},

{
    question: "Which language is used to style web pages?",
    options: [
        "HTML",
        "CSS",
        "Java",
        "Python"
    ],
    answer: 1
},

{
    question: "Which language is mainly used to make websites interactive?",
    options: [
        "CSS",
        "HTML",
        "JavaScript",
        "SQL"
    ],
    answer: 2
},

{
    question: "Which tag is used to create a hyperlink in HTML?",
    options: [
        "<link>",
        "<a>",
        "<href>",
        "<url>"
    ],
    answer: 1
},

{
    question: "Which symbol is used for an ID selector in CSS?",
    options: [
        ".",
        "#",
        "@",
        "*"
    ],
    answer: 1
},

{
    question: "Which symbol is used for a class selector in CSS?",
    options: [
        "#",
        "@",
        ".",
        "$"
    ],
    answer: 2
},

{
    question: "Which HTML tag is used to display an image?",
    options: [
        "<image>",
        "<img>",
        "<picture>",
        "<src>"
    ],
    answer: 1
},

{
    question: "Which property changes text color in CSS?",
    options: [
        "font-color",
        "text-color",
        "color",
        "text-style"
    ],
    answer: 2
},

{
    question: "Which keyword declares a variable in modern JavaScript?",
    options: [
        "variable",
        "let",
        "define",
        "int"
    ],
    answer: 1
},

{
    question: "Which method is used to print something in the browser console?",
    options: [
        "console.log()",
        "print()",
        "echo()",
        "display()"
    ],
    answer: 0
},

{
    question: "What does CSS stand for?",
    options: [
        "Computer Style Sheets",
        "Creative Style System",
        "Cascading Style Sheets",
        "Colorful Style Sheets"
    ],
    answer: 2
},

{
    question: "Which HTML tag creates the largest heading?",
    options: [
        "<h6>",
        "<heading>",
        "<h1>",
        "<head>"
    ],
    answer: 2
},

{
    question: "Which file extension is commonly used for JavaScript?",
    options: [
        ".java",
        ".js",
        ".script",
        ".javascript"
    ],
    answer: 1
},

{
    question: "Which technology is used to structure a web page?",
    options: [
        "HTML",
        "CSS",
        "JavaScript",
        "PHP"
    ],
    answer: 0
},

{
    question: "Which CSS property is used to change the background color?",
    options: [
        "color",
        "background-color",
        "bg-color",
        "background-style"
    ],
    answer: 1
}

];

let currentQuestion = 0;
let score = 0;
let timeLeft = 15;
let timer;

const questionElement = document.getElementById("question");
const optionsElement = document.getElementById("options");
const timerElement = document.getElementById("timer");
const questionNumber = document.getElementById("questionNumber");
const progressBar = document.getElementById("progressBar");

function loadQuestion() {

    clearInterval(timer);

    timeLeft = 15;

    timerElement.textContent = "15s";
    timerElement.classList.remove("warning");

    const q = questions[currentQuestion];

    questionElement.textContent = q.question;

    questionNumber.textContent =
        `Question ${currentQuestion + 1} / ${questions.length}`;

    progressBar.style.width =
        `${((currentQuestion + 1) / questions.length) * 100}%`;

    optionsElement.innerHTML = "";

    q.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.classList.add("option");
        button.textContent = option;

        button.onclick = () => selectAnswer(index);

        optionsElement.appendChild(button);
    });

    startTimer();
}

function startTimer() {

    timer = setInterval(() => {

        timeLeft--;

        timerElement.textContent = timeLeft + "s";

        if (timeLeft <= 5) {
            timerElement.classList.add("warning");
        }

        if (timeLeft <= 0) {

            clearInterval(timer);

            selectAnswer(-1);
        }

    }, 1000);
}

function selectAnswer(selected) {

    clearInterval(timer);

    const correct = questions[currentQuestion].answer;
    const buttons = document.querySelectorAll(".option");

    buttons.forEach(button => button.disabled = true);

    if (selected === correct) {

        score++;

        buttons[selected].classList.add("correct");

    } else {

        if (selected >= 0) {
            buttons[selected].classList.add("wrong");
        }

        buttons[correct].classList.add("correct");
    }

    setTimeout(() => {

        currentQuestion++;

        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }

    }, 700);
}

function showResult() {

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent =
        `${score} / ${questions.length}`;

    const percentage = (score / questions.length) * 100;

    let message;

    if (percentage >= 80) {
        message = "Excellent! 🔥";
    } else if (percentage >= 60) {
        message = "Good job! 👍";
    } else if (percentage >= 40) {
        message = "Keep practicing! 💪";
    } else {
        message = "Time to study and try again! 📚";
    }

    document.getElementById("message").textContent = message;
}

function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("result").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
